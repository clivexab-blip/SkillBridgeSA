name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Generate Gradle Wrapper
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle-8.7-bin.zip
        export PATH=$PWD/gradle-8.7/bin:$PATH
        gradle wrapper

    - name: Create google-services.json for CI
      run: |
        mkdir -p app/src/debug app/src/release
        JSON_CONTENT='{
          "project_info": {
            "project_number": "1234567890",
            "project_id": "skillbridge-sa-ci",
            "storage_bucket": "skillbridge-sa-ci.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                "android_client_info": {
                  "package_name": "com.skillbridge.sa"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyDummyKeyForCIBuildsOnly123456789"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }'
        echo "$JSON_CONTENT" > app/google-services.json
        echo "$JSON_CONTENT" > app/src/debug/google-services.json
        echo "$JSON_CONTENT" > app/src/release/google-services.json

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK & Run Unit Tests
      run: ./gradlew testDebugUnitTest assembleDebug
